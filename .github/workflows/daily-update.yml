name: Cập nhật tỷ giá hàng ngày

on:
  schedule:
    # Giờ UTC. Việt Nam = UTC+7, nên: 01:30→8h30, 04:00→11h, 07:30→14h30.
    # Chạy 3 lần trong ngày làm việc để bắt được các lần ngân hàng đổi tỷ giá.
    - cron: "30 1 * * 1-6"
    - cron: "0 4 * * 1-6"
    - cron: "30 7 * * 1-6"
  workflow_dispatch: {}

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài các thư viện hệ thống cho Chromium (Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxi6 libxtst6 fonts-liberation

      - name: Cài dependencies npm (kèm tải Chromium cho Puppeteer)
        run: npm install

      - name: Chạy scraper và ghi vào Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: npm run scrape
