name: Cập nhật tỷ giá hàng ngày

on:
  schedule:
    # Giờ UTC, Việt Nam = UTC+7. Cách 2 tiếng/lần trong giờ làm việc,
    # thứ 2 đến thứ 7: 8h, 10h, 12h, 14h, 16h và chốt lần cuối lúc 17h.
    - cron: "0 1,3,5,7,9,10 * * 1-6"
  workflow_dispatch: {}
    # ↑ Cho phép chạy thủ công: từ tab "Actions" trên GitHub (nút "Run workflow"),
    # hoặc được gọi từ nút "Cập nhật ngay" trên dashboard qua Netlify Function.

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài các thư viện hệ thống cho Chromium (Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxi6 libxtst6 fonts-liberation

      - name: Cài dependencies npm (kèm tải Chromium cho Puppeteer)
        run: npm install

      - name: Chạy scraper và ghi vào Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: npm run scrape
